<svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="siLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <radialGradient id="siLogoBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080A0F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="siLogoGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080A0F" stop-opacity="0.98" />
    </linearGradient>
    <filter id="siLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="45" fill="url(#siLogoBgGlow)" />

  <!-- Outer Cyber Hex Shield -->
  <polygon
    points="50,6 88,26 88,74 50,94 12,74 12,26"
    fill="url(#siLogoGlass)"
    stroke="url(#siLogoGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Cyber Corner Tech Ticks -->
  <line x1="50" y1="6" x2="50" y2="14" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="94" x2="50" y2="86" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="26" x2="19" y2="30" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="74" x2="81" y2="70" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />

  <!-- Node Dots -->
  <circle cx="50" cy="6" r="2.2" fill="#60A5FA" />
  <circle cx="88" cy="26" r="2.2" fill="#60A5FA" />
  <circle cx="88" cy="74" r="2.2" fill="#60A5FA" />
  <circle cx="50" cy="94" r="2.2" fill="#60A5FA" />
  <circle cx="12" cy="74" r="2.2" fill="#60A5FA" />
  <circle cx="12" cy="26" r="2.2" fill="#60A5FA" />

  <!-- Stylized Monogram S -->
  <path
    d="M 68,30 
       L 36,30 
       C 29,30 25,34 25,40 
       C 25,46 30,49 37,51 
       L 63,55 
       C 70,57 75,61 75,67 
       C 75,73 70,77 63,77 
       L 30,77"
    fill="none"
    stroke="url(#siLogoGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#siLogoGlow)"
  />

  <!-- Central Vertical Pillar I (High Tech Pillar) -->
  <line
    x1="50"
    y1="21"
    x2="50"
    y2="85"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="16 18 16"
  />

  <!-- Radiant Center Core Orb -->
  <circle cx="50" cy="50" r="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.8" />
  
  <!-- End Accent Nodes -->
  <circle cx="68" cy="30" r="2.5" fill="#FFFFFF" />
  <circle cx="30" cy="77" r="2.5" fill="#FFFFFF" />
</svg>
